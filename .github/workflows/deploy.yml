name: Build, Release APK & Deploy to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    name: Build APK, Web & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Web Build as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitit-web-build
          path: build/web/
          if-no-files-found: error

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "SplitIt Latest Release"
          body: |
            ### SplitIt - Automatic Build & Release
            - Built automatically from latest commit on `main`.
            - Download `app-release.apk` below to install on your Android device.
            - Web app deployed to Firebase: https://splitwise-app-cd9933.web.app
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting & Rules (Service Account)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLITWISE_APP_CD9933 }}'
          channelId: live
          projectId: splitwise-app-cd9933
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLITWISE_APP_CD9933 != '' }}

      - name: Deploy to Firebase Hosting & Rules (Token Fallback)
        if: env.HAS_TOKEN == 'true' && env.HAS_SERVICE_ACCOUNT != 'true'
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --project splitwise-app-cd9933
        env:
          HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLITWISE_APP_CD9933 != '' }}
